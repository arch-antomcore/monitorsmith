        <h1>MonitorSmith — O Canivete Suíço em Ferramentas para o seu Monitor</h1>
        <p>Desenvolvido pela <strong>EXVORN.TECH</strong>, o MonitorSmith é a suíte de ferramentas web definitiva para testes, diagnósticos e utilitários de tela.</p>
        <h2>Ferramentas Disponíveis:</h2>
        <ul>
          <li><strong>Tela Preta OLED:</strong> Preto absoluto #000000 para economia de energia em telas OLED e teste de vazamento de luz em monitores IPS/VA.</li>
          <li><strong>Teste de Pixels:</strong> Diagnóstico de dead pixels e pixels presos com 8 cores padrão e alternância via atalhos.</li>
          <li><strong>Modo Limpeza:</strong> Tela de inspeção de poeira e impressões digitais com trava de atalhos por 30 segundos.</li>
          <li><strong>Verificação Visual de Display:</strong> 10 padrões de teste físico incluindo grinalda SMPTE, Near-Black 5%, burn-in 1Hz e Moiré 1:1.</li>
          <li><strong>Luz Suave:</strong> Transforme seu monitor em softbox para videochamadas com temperatura ajustável de 1800K a 12000K.</li>
          <li><strong>Timer de Foco com Ruído Marrom:</strong> Cronômetro Pomodoro integrado com gerador de ruído marrom synthesized via Web Audio API.</li>
          <li><strong>Relógio de Tela Cheia:</strong> Exibição de hora analógica e digital elegante para telas secundárias.</li>
          <li><strong>Mensagens em Tela:</strong> Cartaz de aviso, teleprompter espelhado (scaleX-1) e gerador de QR code.</li>
          <li><strong>Chroma Key & Cor:</strong> Fundo verde (#00B140) e azul estúdio para recorte em transmissões.</li>
        </ul>
