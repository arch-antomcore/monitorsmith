        <h1>MonitorSmith — Ferramentas para o seu monitor</h1>
        <p>Desenvolvido pela <strong>EXVORN.TECH</strong>, o MonitorSmith reúne superfícies, padrões de inspeção visual e utilitários para telas secundárias.</p>
        <h2>Ferramentas Disponíveis:</h2>
        <ul>
          <li><strong>Tela preta:</strong> superfície #000000 para reduzir luz e observar pontos luminosos ou vazamentos em ambiente escuro.</li>
          <li><strong>Teste de pixels:</strong> oito cores sólidas para inspeção visual de pontos suspeitos.</li>
          <li><strong>Inspeção para limpeza:</strong> fundos de contraste que ajudam a localizar poeira e marcas antes da limpeza.</li>
          <li><strong>Verificação visual:</strong> padrões experimentais para observar contraste, tons, gradientes e nitidez.</li>
          <li><strong>Luz suave e cor:</strong> superfícies ajustáveis para chamadas, gravações, cenários e chroma key.</li>
          <li><strong>Produtividade:</strong> timer de foco, relógio, mensagem em tela, teleprompter e loop de marcas.</li>
        </ul>
        <p>Os resultados são observacionais e não substituem instrumentos de medição ou assistência técnica.</p>
      </main>
    </noscript>
