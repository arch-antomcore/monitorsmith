<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Studio Obsidian Black Background -->
  <rect width="1200" height="630" fill="#050506"/>
  
  <!-- Optical Diagnostic Micro-Dot Matrix -->
  <pattern id="dot-matrix" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.12"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dot-matrix)"/>

  <!-- Precision Calibration Frame / Border -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="48" y="48" width="1104" height="534" fill="#0a0a0e" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Technical Crosshairs & Corner Coordinates -->
  <path d="M30 40H50M40 30V50" stroke="#F59E0B" stroke-width="2"/>
  <path d="M1150 40H1170M1160 30V50" stroke="#F59E0B" stroke-width="2"/>
  <path d="M30 590H50M40 570V590" stroke="#F59E0B" stroke-width="2"/>
  <path d="M1150 590H1170M1160 570V590" stroke="#F59E0B" stroke-width="2"/>
  <text x="70" y="85" fill="#F59E0B" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="600" letter-spacing="3">REF_DISPLAY // DIAGNOSTIC_SUITE // EXVORN.TECH</text>
  <text x="1130" y="85" fill="#ffffff" fill-opacity="0.4" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="500" text-anchor="end">SYS_VER: 2.0_PRO</text>

  <!-- Clean Studio Typography (No Cards, No Pill Badges) -->
  <text x="70" y="270" fill="#ffffff" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="78" font-weight="800" letter-spacing="-2">MONITOR<tspan fill="#F59E0B">SMITH</tspan></text>
  <text x="70" y="340" fill="#FDE68A" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="34" font-weight="600" letter-spacing="-0.5">O Canivete Suíço de Diagnóstico e Calibração de Displays</text>

  <!-- Technical Specs Table / Feature List (Direct Text, No Fantasy Containers) -->
  <path d="M70 410H1130" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  
  <text x="70" y="465" fill="#ffffff" fill-opacity="0.9" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="500">[01] TELA PRETA OLED ABSOLUTA</text>
  <text x="450" y="465" fill="#ffffff" fill-opacity="0.9" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="500">[02] TESTE DE DEAD PIXELS</text>
  <text x="820" y="465" fill="#ffffff" fill-opacity="0.9" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="500">[03] INSPEÇÃO E LIMPEZA</text>

  <text x="70" y="520" fill="#ffffff" fill-opacity="0.9" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="500">[04] CALIBRAÇÃO DE GAMA</text>
  <text x="450" y="520" fill="#ffffff" fill-opacity="0.9" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="500">[05] LUZ SUAVE SOFTBOX</text>
  <text x="820" y="520" fill="#ffffff" fill-opacity="0.9" font-family="'JetBrains Mono', Consolas, monospace" font-size="20" font-weight="500">[06] TIMER RUÍDO MARROM</text>

  <!-- Bottom Hardware Bar -->
  <path d="M70 560H1130" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <text x="70" y="565" fill="#F59E0B" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700">HTTPS://MONITORSMITH.APP</text>
  <text x="1130" y="565" fill="#ffffff" fill-opacity="0.4" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="500" text-anchor="end">FREE &amp; OPEN HARDWARE TOOLKIT</text>
</svg>
